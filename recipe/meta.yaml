{% set name = "oschmod" %}
{% set version = "0.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/oschmod-{{ version }}.tar.gz
  sha256: e3af9400b9c29b37199290d8d9b944b5c2fc7b887c65b63aba082f2d24e0c90e

build:
  noarch: python
  entry_points:
    - oschmod = oschmod.cli:main
    - ochmod = oschmod.cli:main
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - pip
    - setuptools
  run:
    - python >={{ python_min }}
    - pywin32-on-windows

test:
  imports:
    - oschmod
  commands:
    - pip check
    - oschmod --help
    - ochmod --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/yakdriver/oschmod
  summary: Windows and Linux compatible chmod
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - sebastian-luna-valero
